apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-redis
  template:
    metadata:
      labels:
        app: shop-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: NodePort
  selector:
    app: shop-redis
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379