name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
      - run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SPRING_DATA_REDIS_PORT: 6379

  publish-image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
      - run: mvn -B -DskipTests package
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/szewczus/redis-example:${{ github.sha }}

      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/szewczus/redis-example:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/szewczus/redis-example:${{ github.sha }}