name: CI #name: CI to nazwa widoczna w zakładce Actions.

on: #to kiedy workflow startuje (to, o co pytasz). Jest na tym samym poziomie wcięcia co name i jobs, czyli na samym początku linii, bez wcięcia.
  pull_request:
  push:
    branches: [main]

jobs: #to co ma się wykonać.
  build-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify