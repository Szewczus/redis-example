apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-redisinsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-redisinsight
  template:
    metadata:
      labels:
        app: shop-redisinsight
    spec:
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
spec:
  selector:
    app: shop-redisinsight
  ports:
    - port: 5540
      targetPort: 5540